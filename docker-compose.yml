# The whole system on one machine: database, API, worker, back office and booking site.
#
#   cp .env.example .env        # then set at least POSTGRES_PASSWORD and APP_ENCRYPTION_KEY
#   docker compose up -d --build
#
# The API and the worker are given everything in .env (or in the file named by
# PMS_ENV_FILE). In production they refuse to start without a payment gateway
# and say so in their logs: `docker compose logs api`.
#
# Open http://localhost:3000 and create the first administrator. For a public
# installation put it behind TLS: `docker compose --profile proxy up -d` adds
# Caddy, which obtains certificates for PMS_DOMAIN and BOOKING_DOMAIN by itself.
# docs/deployment.md has the details.

name: pms

x-app: &app
  restart: unless-stopped
  env_file:
    - path: ${PMS_ENV_FILE:-.env}
      required: false
  environment: &app-environment
    NODE_ENV: production
    DATABASE_URL: postgres://pms:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/pms
    APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
    API_INTERNAL_URL: http://api:4000
    STORAGE_DIR: /data/files
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pms -d pms']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *app
    build:
      context: .
      target: api
    volumes:
      - files:/data/files
    ports:
      # Only on this machine: browsers reach the API through the back office (/api).
      - '127.0.0.1:${API_PORT_LOCAL:-4000}:4000'

  worker:
    <<: *app
    build:
      context: .
      target: worker
    volumes:
      - files:/data/files
    # Long enough for a push to a channel or a webhook delivery in progress to finish.
    stop_grace_period: 45s

  web:
    restart: unless-stopped
    build:
      context: .
      target: web
      args:
        API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-3000}:3000'

  booking:
    restart: unless-stopped
    build:
      context: .
      target: booking
      args:
        API_INTERNAL_URL: http://api:4000
        BOOKING_ORG_SLUG: ${BOOKING_ORG_SLUG:-}
    environment:
      API_INTERNAL_URL: http://api:4000
      BOOKING_ORG_SLUG: ${BOOKING_ORG_SLUG:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${BOOKING_PORT:-3001}:3001'

  # Nightly database dump and a copy of the uploaded files. `--profile backup` switches it on.
  backup:
    image: postgres:16
    profiles: [backup]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pms:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/pms
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      STORAGE_DIR: /data/files
    volumes:
      - backups:/backups
      - files:/data/files:ro
      - ./scripts/backup.sh:/usr/local/bin/pms-backup:ro
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'while true; do /usr/local/bin/pms-backup || echo "backup failed"; sleep 86400; done',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  # TLS in front of the two sites. `--profile proxy` switches it on.
  caddy:
    image: caddy:2
    profiles: [proxy]
    restart: unless-stopped
    environment:
      PMS_DOMAIN: ${PMS_DOMAIN:-pms.localhost}
      BOOKING_DOMAIN: ${BOOKING_DOMAIN:-book.localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - booking

volumes:
  pgdata:
  files:
  backups:
  caddy-data:
  caddy-config:
