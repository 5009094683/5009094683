<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motorbike Rental Agreement</title>
  <link rel="stylesheet" href="assets/agreement.css">
</head>
<body>
  <!--
    No wording is typed in this file.
      data-t="..."   pulls text from content.<language>.js
      data-c="..."   pulls company details from config.js
      data-if="..."  keeps the element only when that config.js option is on
    Edit this file only to add, remove or rearrange boxes on the form.
    A box is <div class="field" style="--span: N">; N is its share of the row width (a row adds up to 12).
  -->

  <!-- Built-in emblem (mountains and a winding road), used when config.js has no logo. -->
  <svg class="defs" aria-hidden="true">
    <clipPath id="emblem-clip"><circle cx="24" cy="24" r="24"/></clipPath>
    <symbol id="emblem" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="24" fill="currentColor"/>
      <g fill="#fff" clip-path="url(#emblem-clip)">
        <circle cx="35.5" cy="12.5" r="3" opacity=".9"/>
        <path d="M1 34C6 25 9.5 18 13 18s7 7 10 16Z" opacity=".5"/>
        <path d="M26 34c3.5-6.5 6.5-11 9.5-11S42 28 47 34Z" opacity=".5"/>
        <path d="M11 34C16 21.5 20 10.5 24 10.5S32 21.5 37 34Z"/>
        <path d="M23.2 33.5C23.2 36.6 29 36.4 29 39.2 29 42.3 17.5 42.5 15 49H27C27.5 44.5 34 43.5 34 39.2 34 35.4 24.8 36 24.8 33.5Z"/>
      </g>
      <circle cx="24" cy="24" r="23.3" fill="none" stroke="currentColor" stroke-width="1.4"/>
    </symbol>
  </svg>

  <div class="toolbar">
    <div class="toolbar-languages" id="language-switch"></div>
    <span class="toolbar-warning" id="overflow-warning" hidden></span>
    <span class="toolbar-hint" data-t="toolbar.hint"></span>
    <button type="button" id="print-button" data-t="toolbar.print"></button>
  </div>

  <main id="agreement">

    <!-- ============ PAGE 1 — the form ============ -->
    <section class="page">
      <header class="brand">
        <div class="brand-identity">
          <span class="brand-logo"></span>
          <div>
            <div class="brand-name" data-c="company.name"></div>
            <div class="brand-tagline" data-t="tagline"></div>
          </div>
        </div>
        <dl class="brand-contacts" data-contacts></dl>
      </header>

      <div class="masthead">
        <div class="national" data-if="showNationalHeader">
          <div class="national-name" data-t="nationalName"></div>
          <div class="national-motto" data-t="nationalMotto"></div>
        </div>
        <h1 class="title" data-t="title"></h1>
        <div class="agreement-number" data-if="showAgreementNumber">
          <span data-t="agreementNumber"></span><span class="blank"></span>
        </div>
      </div>

      <section class="section">
        <h2 class="section-head"><span class="section-number"></span><span data-t="sections.lessor"></span></h2>
        <div class="party-a">
          <div>
            <div class="party-a-name" data-c="company.name"></div>
            <div class="party-a-address" data-if="hasAddress">
              <span data-t="addressLabel"></span>: <b data-c="company.address"></b>
            </div>
          </div>
          <div class="party-a-note" data-t="lessorNote"></div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-head"><span class="section-number"></span><span data-t="sections.renter"></span></h2>
        <div class="fields">
          <div class="row">
            <div class="field" style="--span: 6"><span class="label" data-t="fields.fullName"></span></div>
            <div class="field" style="--span: 2.5">
              <span class="label" data-t="fields.birthDate"></span>
              <span class="guide" data-guide="date"></span>
            </div>
            <div class="field" style="--span: 3.5"><span class="label" data-t="fields.phone"></span></div>
          </div>
          <div class="row">
            <div class="field" style="--span: 8.5"><span class="label" data-t="fields.address"></span></div>
            <div class="field" style="--span: 3.5"><span class="label" data-t="fields.emergencyPhone"></span></div>
          </div>
          <div class="row">
            <div class="field" style="--span: 4"><span class="label" data-t="fields.idNumber"></span></div>
            <div class="field" style="--span: 2.5">
              <span class="label" data-t="fields.idIssueDate"></span>
              <span class="guide" data-guide="date"></span>
            </div>
            <div class="field" style="--span: 2.5">
              <span class="label" data-t="fields.idExpiryDate"></span>
              <span class="guide" data-guide="date"></span>
            </div>
            <div class="field" style="--span: 3"><span class="label" data-t="fields.idIssuePlace"></span></div>
          </div>
          <div class="row">
            <div class="field" style="--span: 4"><span class="label" data-t="fields.licenceClass"></span></div>
            <div class="field" style="--span: 8"><span class="label" data-t="fields.licenceNumber"></span></div>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-head"><span class="section-number"></span><span data-t="sections.vehicle"></span></h2>
        <div class="fields">
          <div class="row" data-if="hasBikeModels">
            <div class="field" style="--span: 12">
              <span class="label" data-t="fields.model"></span>
              <div class="choices" data-list="bikeModels"></div>
            </div>
          </div>
          <div class="row">
            <div class="field" style="--span: 5" data-if="!hasBikeModels"><span class="label" data-t="fields.model"></span></div>
            <div class="field" style="--span: 4"><span class="label" data-t="fields.plate"></span></div>
            <div class="field" style="--span: 3"><span class="label" data-t="fields.colour"></span></div>
          </div>
          <div class="row">
            <div class="field" style="--span: 12">
              <span class="label" data-t="fields.condition"></span>
              <div class="printed">
                <span data-t="fields.conditionText"></span>
                <span class="printed-note" data-t="fields.conditionNotes"></span>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="field" style="--span: 12">
              <span class="label" data-t="fields.accessories"></span>
              <div class="choices" data-list="accessories"></div>
            </div>
          </div>
          <div class="row">
            <div class="field" style="--span: 4.5">
              <span class="label" data-t="fields.pickup"></span>
              <div class="guides">
                <span class="guide" data-guide="time"></span>
                <span class="guide" data-guide="date"></span>
              </div>
            </div>
            <div class="field" style="--span: 4.5">
              <span class="label" data-t="fields.return"></span>
              <div class="guides">
                <span class="guide" data-guide="time"></span>
                <span class="guide" data-guide="date"></span>
              </div>
            </div>
            <div class="field" style="--span: 3">
              <span class="label" data-t="fields.totalDays"></span>
              <span class="unit" data-t="fields.days"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-head"><span class="section-number"></span><span data-t="sections.price"></span></h2>
        <div class="fields">
          <div class="row">
            <div class="field" style="--span: 4">
              <span class="label" data-t="fields.rate"></span>
              <span class="unit" data-t="fields.perDay"></span>
            </div>
            <div class="field" style="--span: 4">
              <span class="label" data-t="fields.totalFee"></span>
              <span class="unit" data-t="fields.currency"></span>
            </div>
            <div class="field" style="--span: 4">
              <span class="label" data-t="fields.paidBy"></span>
              <div class="choices">
                <span class="check"><i class="box"></i><span data-t="fields.cash"></span></span>
                <span class="check"><i class="box"></i><span data-t="fields.transfer"></span></span>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="field" style="--span: 12"><span class="label" data-t="fields.deposit"></span></div>
          </div>
        </div>
      </section>

      <section class="section section-sign">
        <h2 class="section-head">
          <span class="section-number"></span><span data-t="sections.handover"></span>
          <span class="section-when" data-t="sections.handoverWhen"></span>
        </h2>
        <p class="statement" data-t="handoverStatement"></p>
        <div class="signatures">
          <div class="signature">
            <div class="signature-party"><strong data-t="signature.partyA"></strong><span data-t="signature.roleA"></span></div>
            <div class="signature-hint" data-t="signature.hint"></div>
          </div>
          <div class="signature">
            <div class="signature-party"><strong data-t="signature.partyB"></strong><span data-t="signature.roleB"></span></div>
            <div class="signature-hint" data-t="signature.hint"></div>
          </div>
        </div>
      </section>

      <footer class="page-footer"></footer>
    </section>

    <!-- ============ PAGE 2 — terms & return ============ -->
    <section class="page">
      <header class="brand brand-compact">
        <div class="brand-identity">
          <span class="brand-logo"></span>
          <div class="brand-name" data-c="company.name"></div>
        </div>
        <div class="running-title" data-t="title"></div>
      </header>

      <h1 class="title title-terms" data-t="termsTitle"></h1>

      <!-- The articles are generated from the "articles" list in content.<language>.js -->
      <div class="terms" id="terms"></div>

      <section class="section section-sign">
        <h2 class="section-head">
          <span class="section-number"></span><span data-t="sections.settlement"></span>
          <span class="section-when" data-t="sections.settlementWhen"></span>
        </h2>
        <p class="statement" data-t="settlementStatement"></p>
        <div class="signatures">
          <div class="signature">
            <div class="signature-party"><strong data-t="signature.partyA"></strong><span data-t="signature.roleA"></span></div>
            <div class="signature-hint" data-t="signature.hint"></div>
          </div>
          <div class="signature">
            <div class="signature-party"><strong data-t="signature.partyB"></strong><span data-t="signature.roleB"></span></div>
            <div class="signature-hint" data-t="signature.hint"></div>
          </div>
        </div>
      </section>

      <footer class="page-footer"></footer>
    </section>

  </main>

  <script src="config.js"></script>
  <script src="content.vi.js"></script>
  <script src="content.en.js"></script>
  <script src="assets/agreement.js"></script>
</body>
</html>
