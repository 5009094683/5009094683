<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motorbike Rental Agreement</title>
  <link rel="stylesheet" href="assets/agreement.css">
</head>
<body>
  <!--
    MOTORBIKE RENTAL AGREEMENT — layout of the form.

    No wording is typed in this file.
      data-t="..."       pulls text from motorbike-rental.<language>.js, or from common.<language>.js
      data-c="..."       pulls a value from config.js
      data-if="..."      keeps the element only when that config.js option is on
      data-part="..."    inserts a block shared by all agreements (header, title, signature boxes...)
      data-ticks="..."   prints a list as tick boxes; data-counts="..." prints it as boxes for a number
    Edit this file only to add, remove or rearrange boxes on the form.
    A box is <div class="field" style="--span: N">; N is its share of the row width (a row adds up to 12).
  -->

  <main id="agreement">

    <!-- ============ PAGE 1 — the form ============ -->
    <section class="page">
      <header class="brand" data-part="brand"></header>
      <div class="masthead" data-part="masthead"></div>

      <section class="section">
        <h2 class="section-head"><span class="section-number"></span><span data-t="sections.lessor"></span></h2>
        <div class="party-a" data-part="party-a"></div>
      </section>

      <section class="section">
        <h2 class="section-head"><span class="section-number"></span><span data-t="sections.renter"></span></h2>
        <div class="fields">
          <div class="row">
            <div class="field" style="--span: 6"><span class="label" data-t="fields.fullName"></span></div>
            <div class="field" style="--span: 2.5">
              <span class="label" data-t="fields.birthDate"></span>
              <span class="guide" data-guide="date"></span>
            </div>
            <div class="field" style="--span: 3.5"><span class="label" data-t="fields.phone"></span></div>
          </div>
          <div class="row">
            <div class="field" style="--span: 8.5"><span class="label" data-t="fields.address"></span></div>
            <div class="field" style="--span: 3.5"><span class="label" data-t="fields.emergencyPhone"></span></div>
          </div>
          <div class="row">
            <div class="field" style="--span: 4"><span class="label" data-t="fields.idNumber"></span></div>
            <div class="field" style="--span: 2.5">
              <span class="label" data-t="fields.idIssueDate"></span>
              <span class="guide" data-guide="date"></span>
            </div>
            <div class="field" style="--span: 2.5">
              <span class="label" data-t="fields.idExpiryDate"></span>
              <span class="guide" data-guide="date"></span>
            </div>
            <div class="field" style="--span: 3"><span class="label" data-t="fields.idIssuePlace"></span></div>
          </div>
          <div class="row">
            <div class="field" style="--span: 4"><span class="label" data-t="fields.licenceClass"></span></div>
            <div class="field" style="--span: 8"><span class="label" data-t="fields.licenceNumber"></span></div>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-head"><span class="section-number"></span><span data-t="sections.vehicle"></span></h2>
        <div class="fields">
          <div class="row" data-if="hasBikeModels">
            <div class="field" style="--span: 12">
              <span class="label" data-t="fields.model"></span>
              <div class="choices" data-ticks="bikeModels" data-other="fields.other"></div>
            </div>
          </div>
          <div class="row">
            <div class="field" style="--span: 5" data-if="!hasBikeModels"><span class="label" data-t="fields.model"></span></div>
            <div class="field" style="--span: 4"><span class="label" data-t="fields.plate"></span></div>
            <div class="field" style="--span: 3"><span class="label" data-t="fields.colour"></span></div>
          </div>
          <div class="row">
            <div class="field" style="--span: 12">
              <span class="label" data-t="fields.condition"></span>
              <div class="printed">
                <span data-t="fields.conditionText"></span>
                <span class="printed-note" data-t="fields.conditionNotes"></span>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="field" style="--span: 12">
              <span class="label" data-t="fields.accessories"></span>
              <div class="choices" data-counts="fields.accessoryItems" data-other="fields.other"></div>
            </div>
          </div>
          <div class="row">
            <div class="field" style="--span: 4.5">
              <span class="label" data-t="fields.pickup"></span>
              <div class="guides">
                <span class="guide" data-guide="time"></span>
                <span class="guide" data-guide="date"></span>
              </div>
            </div>
            <div class="field" style="--span: 4.5">
              <span class="label" data-t="fields.return"></span>
              <div class="guides">
                <span class="guide" data-guide="time"></span>
                <span class="guide" data-guide="date"></span>
              </div>
            </div>
            <div class="field" style="--span: 3">
              <span class="label" data-t="fields.totalDays"></span>
              <span class="unit" data-t="fields.days"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-head"><span class="section-number"></span><span data-t="sections.price"></span></h2>
        <div class="fields">
          <div class="row">
            <div class="field" style="--span: 4">
              <span class="label" data-t="fields.rate"></span>
              <span class="unit" data-t="fields.perDay"></span>
            </div>
            <div class="field" style="--span: 4">
              <span class="label" data-t="fields.totalFee"></span>
              <span class="unit" data-t="fields.currency"></span>
            </div>
            <div class="field" style="--span: 4">
              <span class="label" data-t="fields.paidBy"></span>
              <div class="choices" data-ticks="fields.paymentMethods"></div>
            </div>
          </div>
          <div class="row">
            <div class="field" style="--span: 12"><span class="label" data-t="fields.deposit"></span></div>
          </div>
        </div>
      </section>

      <section class="section section-sign">
        <h2 class="section-head">
          <span class="section-number"></span><span data-t="sections.handover"></span>
          <span class="section-when" data-t="sections.handoverWhen"></span>
        </h2>
        <p class="statement" data-t="handoverStatement"></p>
        <div class="signatures" data-part="signatures"></div>
      </section>
    </section>

    <!-- ============ PAGE 2 — terms & return ============ -->
    <section class="page">
      <header class="brand brand-compact" data-part="brand-compact"></header>

      <h1 class="title title-terms" data-t="termsTitle"></h1>

      <!-- The articles are generated from the "articles" list in motorbike-rental.<language>.js -->
      <div class="terms" id="terms"></div>

      <section class="section section-sign">
        <h2 class="section-head">
          <span class="section-number"></span><span data-t="sections.settlement"></span>
          <span class="section-when" data-t="sections.settlementWhen"></span>
        </h2>
        <p class="statement" data-t="settlementStatement"></p>
        <div class="signatures" data-part="signatures"></div>
      </section>
    </section>

  </main>

  <script src="config.js"></script>
  <script src="common.vi.js"></script>
  <script src="common.en.js"></script>
  <script src="motorbike-rental.vi.js"></script>
  <script src="motorbike-rental.en.js"></script>
  <script src="assets/agreement.js"></script>
</body>
</html>
