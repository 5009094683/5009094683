name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: pms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pms:pms@localhost:5432/pms
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: pms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pms:pms@localhost:5432/pms
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Uses the Chrome that ships on the runner image; no browser download.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

  containers:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the images and start the whole system
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=ci-only-password
          APP_ENCRYPTION_KEY=$(openssl rand -base64 32)
          PAYMENT_PROVIDER=mock
          EOF
          docker compose up -d --build --wait --wait-timeout 300
      - name: Check that it answers
        run: |
          curl -fsS http://localhost:3000/login > /dev/null
          curl -fsS http://localhost:3000/api/setup/status | grep -q '"setupComplete":false'
          curl -fsS -H 'content-type: application/json' \
            -d '{"orgName":"CI Hotels","adminName":"CI Admin","adminEmail":"ci@example.com","adminPassword":"a long enough passphrase 42"}' \
            http://localhost:3000/api/setup
          curl -fsS http://localhost:3000/api/setup/status | grep -q '"setupComplete":true'
          curl -fsS http://localhost:3001/ > /dev/null
      - name: Back up and check the dump
        run: |
          docker compose --profile backup run --rm --entrypoint /usr/local/bin/pms-backup backup
      - name: Logs
        if: failure()
        run: docker compose logs --tail 200
